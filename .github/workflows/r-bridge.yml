name: R bridge

# Golden and live tests against real R, ferx and vpc. Runs on pull requests that touch the bridge
# scripts, the fixtures or the code that reads their output, and every night, so a drift in ferx
# or vpc shows up within a day even when no PR touches these files.
on:
  pull_request:
    paths:
      - 'src/io/r_extract.rs'
      - 'src/io/fitrx.rs'
      - 'src/domain/**'
      - 'src/ui/sim_tab.rs'
      - 'tests/**'
      - '.github/workflows/r-bridge.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Missing R, ferx or fixtures is a failure here, never a silent skip.
  FERX_REQUIRE_FIXTURES: '1'
  # A commit pins the engine (ferx-r ships src/rust/Cargo.lock, which pins ferx-core). It is the first
  # with SIR draws saved in bundles and SIR/covariance on fixed-effects fits (ferx-r #552, #553);
  # move to the release tag that contains them once one exists.
  FERX_R_REF: 67e075ea2a4166280af85d8ef3dc9f872a88aff9

jobs:
  r-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Build tools for ferx's compiled Rust backend (as in the ferx-r Dockerfile).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lld libssl-dev pkg-config libzstd-dev \
            build-essential libcurl4-openssl-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ env.FERX_R_REF }}-v1

      - name: Install ferx, vpc, jsonlite
        run: |
          Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")'
          Rscript -e 'pak::pak(c(paste0("FeRx-NLME/ferx-r@", Sys.getenv("FERX_R_REF")), "vpc", "jsonlite"))'

      - name: Versions
        run: Rscript -e 'cat(R.version.string, "| ferx", as.character(packageVersion("ferx")), "| vpc", as.character(packageVersion("vpc")), "\n")'

      - name: Test (including live R tests)
        run: cargo test --verbose
